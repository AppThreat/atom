name: pull_request
# testing, the pr-tests legs and js-parsetools-main are required status checks on main, so this workflow must
# trigger on every pull request and on merge-group builds; the heavy language and repo-test
# matrices skip merge-group builds via their own if:. A change to the documentation alone still
# reports the required checks, but builds nothing (see `changes`).
on:
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
# Google's mirror of Maven Central first, with repo1 and every resolver the build declares
# (see build.sbt) as fallbacks: Maven Central is rate-limited/flaky from CI - the sbt launcher
# itself failed to download org.scala-sbt:sbt while the artifact existed. This drives the sbt
# launcher as well as the build's dependency resolution. the github-packages action writes the
# GitHub Packages credentials coursier needs for the last entry. Coursier requires pipe-separated
# entries - a ';' separator or unknown alias makes it ignore the whole list.
env:
  COURSIER_REPOSITORIES: "ivy2Local|https://maven-central.storage-download.googleapis.com/maven2|https://repo1.maven.org/maven2|https://maven.google.com|https://oss.sonatype.org/content/repositories/public|https://packages.atlassian.com/mvn/maven-atlassian-external|https://repo.gradle.org/gradle/libs-releases|https://maven.pkg.github.com/appthreat/chen"

jobs:
  # Whether anything but documentation (docs/, Markdown) changed. The other workflows skip such
  # pull requests with paths-ignore, but a workflow that does not run never reports its required
  # checks, so this one runs and its jobs pass without building.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          files=""
          case "$EVENT" in
            pull_request) files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') ;;
            # the compare API lists at most 300 files: more counts as code
            merge_group) files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" \
              --jq 'if (.files | length) < 300 then .files[].filename else "more" end') ;;
          esac
          code=true
          if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<<"$files"; then code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  # The unit tests and distribution build on the other operating systems, so a merge cannot
  # land while Windows or macOS is failing. Ubuntu is covered by `testing` below, which also
  # carries the full repo-scan battery; these legs stop at build + test to keep the merge
  # queue fast.
  pr-tests:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    # a check with nothing to build needs no Windows or macOS machine: its name comes from the
    # matrix values. (A skipped matrix job would report one unexpanded name, not these.)
    runs-on: ${{ needs.changes.outputs.code == 'true' && matrix.os || 'ubuntu-latest' }}
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - name: Documentation only
        if: env.CODE != 'true'
        run: echo "Only documentation changed - nothing to build."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.CODE == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        if: env.CODE == 'true'
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
        if: env.CODE == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        if: env.CODE == 'true'
        with:
          node-version: '26.x'
          package-manager-cache: false
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465  # v9.0.1
        if: env.CODE == 'true'
      - uses: ./.github/actions/github-packages
        if: env.CODE == 'true'
        with:
          # Temporary: build chen from the 390 fix branch until AppThreat/chen#316 merges, so the
          # un-skipped Windows EDG case runs against the tokenizer fix; back to main afterwards.
          chen-ref: fix/390-edg-header-short-name-attribution
      # Before `sbt test`: the C frontend workflow tests cancel their EDG cases without edga
      - uses: ./.github/actions/edga
        if: env.CODE == 'true'
      # Before `sbt test`: the workflow tests probe for the AST generators and cancel without
      # them, so a post-test install would silently skip the JavaScript (and Ruby) fixtures.
      - run: npm install -g @appthreat/atom-parsetools
        if: env.CODE == 'true'
      - run: sbt --server -batch "scalafmtCheck; testFull; stage; createDistribution"
        if: env.CODE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

  # atom's JavaScript tests and a juice-shop run against atom-parsetools main with parsa, so what
  # the next atom-parsetools release ships (native type maps by default) is tested here before it
  # reaches npm. The other jobs use the release on npm. A required check, run on pull requests only
  # (a merge-group build or a documentation change skips it, and a skipped check counts as passed).
  js-parsetools-main:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'juice-shop/juice-shop'
          path: 'repotests/juice-shop'
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.x'
          package-manager-cache: false
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465  # v9.0.1
      - uses: ./.github/actions/github-packages
      # Before `sbt test`: the workflow tests probe for astgen and cancel without it
      - uses: ./.github/actions/parsetools-from-main
      # only the JavaScript groups of the cross-language suite: a checkout of atom-parsetools has no
      # plugins/ bundles (php-parser, ruby_ast_gen), which are built when the package is published
      - run: sbt --server -batch "testOnly io.appthreat.atom.Js*; testOnly io.appthreat.atom.ReachablesCrossLanguageWorkflowTests -- -z javascript -z frontend; stage"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      - name: Reachables on juice-shop with native type maps
        run: |
          ./atom.sh --remove-atom -o /tmp/juice.atom -l js "$GITHUB_WORKSPACE/repotests/juice-shop" -Dlog4j.configurationFile=log4j2.xml

  testing:
    needs: changes
    # a skipped job reports success, which is what a required check wants of a documentation change
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          ruby-version: '4.0.5'
          bundler-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'ShiftLeftSecurity/shiftleft-java-example'
          path: 'repotests/shiftleft-java-example'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'juice-shop/juice-shop'
          path: 'repotests/juice-shop'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'ShiftLeftSecurity/shiftleft-ts-example'
          path: 'repotests/shiftleft-ts-example'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'libexpat/libexpat'
          path: 'repotests/libexpat'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'HooliCorp/DjanGoat'
          path: 'repotests/DjanGoat'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'DefectDojo/django-DefectDojo'
          path: 'repotests/django-DefectDojo'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'bionomia/bionomia'
          path: 'repotests/bionomia'
          ref: '5ada8b5f4a5f68561a7195e2badc2f744dc4676e'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'OWASP/railsgoat'
          path: 'repotests/railsgoat'
          ref: 'c1e8ff1e3b24a1c48fcfc9fbee0f65dc296b49d9'
          persist-credentials: false
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465  # v9.0.1
      - name: Set up JDK
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc  # v1.6.8
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'
          cache: ''
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
      - uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4  # v3.1.0
        with:
          apps: scala3 scalac
      - uses: ./.github/actions/github-packages
      # Before `sbt test`: the C frontend workflow tests cancel their EDG cases without edga
      - uses: ./.github/actions/edga
      - run: |
          # Install the AST generators (astgen, phpastgen, rbastgen) BEFORE `sbt test`: the
          # workflow tests probe for them and cancel without them, so a post-test install would
          # silently skip the JavaScript (and Ruby) reachables fixtures.
          npm install -g @appthreat/atom-parsetools
          sbt --server "scalafmtCheck; testFull; stage; createDistribution"
          cd wrapper/nodejs
          bash build.sh
          npm install -g .
          cd ../..
          ./atom.sh --remove-atom -o /tmp/java.atom -l java $GITHUB_WORKSPACE/repotests/shiftleft-java-example -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh --remove-atom -o /tmp/juice.atom -l js $GITHUB_WORKSPACE/repotests/juice-shop -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh --remove-atom -o /tmp/ts.atom -l js $GITHUB_WORKSPACE/repotests/shiftleft-ts-example -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh --remove-atom -o /tmp/py.atom -l python $GITHUB_WORKSPACE/repotests/DjanGoat -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh --remove-atom -o /tmp/py2.atom -l python $GITHUB_WORKSPACE/repotests/django-DefectDojo -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh --remove-atom -o /tmp/c.atom -l c $GITHUB_WORKSPACE/repotests/libexpat -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh --remove-atom -o /tmp/railsgoat.atom -l ruby $GITHUB_WORKSPACE/repotests/railsgoat -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh --remove-atom -o /tmp/bionomia.atom -l ruby $GITHUB_WORKSPACE/repotests/bionomia -Dlog4j.configurationFile=log4j2.xml

          ./atom.sh data-flow -o /tmp/java2.atom -l java $GITHUB_WORKSPACE/repotests/shiftleft-java-example -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/java.slices.json
          # ./atom.sh data-flow --remove-atom -o /tmp/juice2.atom -l js $GITHUB_WORKSPACE/repotests/juice-shop -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/juice.slices.json
          ./atom.sh data-flow -o /tmp/ts2.atom -l js $GITHUB_WORKSPACE/repotests/shiftleft-ts-example -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/ts.slices.json
          ./atom.sh data-flow -o /tmp/py2.atom -l python $GITHUB_WORKSPACE/repotests/DjanGoat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/py.slices.json
          ./atom.sh data-flow --sink-filter ".*print.*" -o /tmp/c2.atom -l c $GITHUB_WORKSPACE/repotests/libexpat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/c.slices.json

          ./atom.sh usages -o /tmp/java2.atom -l java $GITHUB_WORKSPACE/repotests/shiftleft-java-example -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/java.usages.json
          ./atom.sh usages -o /tmp/juice2.atom -l js $GITHUB_WORKSPACE/repotests/juice-shop -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/juice.usages.json
          ./atom.sh usages -o /tmp/ts2.atom -l js $GITHUB_WORKSPACE/repotests/shiftleft-ts-example -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/ts.usages.json
          ./atom.sh usages -o /tmp/py2.atom -l python $GITHUB_WORKSPACE/repotests/DjanGoat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/py.usages.json
          ./atom.sh usages -o /tmp/py3.atom -l python $GITHUB_WORKSPACE/repotests/django-DefectDojo -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/py4.usages.json
          ./atom.sh usages -o /tmp/c2.atom -l c $GITHUB_WORKSPACE/repotests/libexpat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/c.usages.json
          ./atom.sh usages --remove-atom -o /tmp/railsgoat2.atom -l ruby $GITHUB_WORKSPACE/repotests/railsgoat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/railsgoat2.usages.json
          ./atom.sh usages --remove-atom -o /tmp/bionomia2.atom -l ruby $GITHUB_WORKSPACE/repotests/bionomia -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/bionomia2.usages.json

          # Graph export and algorithms over a small committed sample. The first export builds
          # the atom; the remaining commands reuse it.
          ./atom.sh export -o /tmp/sample.atom -l python --format graphml --scope whole --out /tmp/sample-exports $GITHUB_WORKSPACE/test/fixtures/sample-py -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh export -o /tmp/sample.atom -l python --format gnn --scope methods --out /tmp/sample-gnn $GITHUB_WORKSPACE/test/fixtures/sample-py -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh algorithms -o /tmp/sample.atom -l python --type centrality --slice-outfile /tmp/sample.centrality.json $GITHUB_WORKSPACE/test/fixtures/sample-py -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh algorithms -o /tmp/sample.atom -l python --type scc --slice-outfile /tmp/sample.scc.json $GITHUB_WORKSPACE/test/fixtures/sample-py -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh algorithms -o /tmp/sample.atom -l python --type toposort --slice-outfile /tmp/sample.toposort.json $GITHUB_WORKSPACE/test/fixtures/sample-py -Dlog4j.configurationFile=log4j2.xml
          ./atom.sh algorithms -o /tmp/sample.atom -l python --config $GITHUB_WORKSPACE/test/fixtures/algorithms-paths.json $GITHUB_WORKSPACE/test/fixtures/sample-py -Dlog4j.configurationFile=log4j2.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          npm install -g @cdxgen/cdxgen --omit=optional
          cdxgen -t python --deep -o $GITHUB_WORKSPACE/repotests/DjanGoat/bom.json $GITHUB_WORKSPACE/repotests/DjanGoat
          # Reachables runs the Flux engine by default, which builds method flow summaries and uses
          # them for summary-guided pruning (cached next to the atom). `--legacy-dataflow` opts out.
          ./atom.sh reachables -o /tmp/DjanGoat.atom -l python $GITHUB_WORKSPACE/repotests/DjanGoat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/DjanGoat.reachables.json
          # Reachables with a validators/sanitisers config: flows through declared sanitisers are dropped.
          ./atom.sh reachables --validation-config $GITHUB_WORKSPACE/test/fixtures/validators.json -o /tmp/DjanGoat.atom -l python $GITHUB_WORKSPACE/repotests/DjanGoat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/DjanGoat.reachables.sanitised.json
          ./atom.sh usages -o /tmp/DjanGoat.atom -l python $GITHUB_WORKSPACE/repotests/DjanGoat -Dlog4j.configurationFile=log4j2.xml --slice-outfile /tmp/DjanGoat.usages.json
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      - run: |
          bash ci/native-image.sh
          ./target/graalvm-native-image/atom --remove-atom -o /tmp/java.atom -l java $GITHUB_WORKSPACE/repotests/shiftleft-java-example -Dlog4j.configurationFile=log4j2.xml
        env:
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
      - name: Generate SBOM with cdxgen
        run: |
          npm install -g @cdxgen/cdxgen
          cdxgen -t sbt -o bom.json . -p --no-recurse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
