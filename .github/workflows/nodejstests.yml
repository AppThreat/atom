name: langtests
on:
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
# Google's mirror of Maven Central first, with repo1 and every resolver the build declares
# (see build.sbt) as fallbacks: Maven Central is rate-limited/flaky from CI - the sbt launcher
# itself failed to download org.scala-sbt:sbt while the artifact existed. This drives the sbt
# launcher as well as the build's dependency resolution. the github-packages action writes the
# GitHub Packages credentials coursier needs for the last entry. Coursier requires pipe-separated
# entries - a ';' separator or unknown alias makes it ignore the whole list.
env:
  COURSIER_REPOSITORIES: "ivy2Local|https://maven-central.storage-download.googleapis.com/maven2|https://repo1.maven.org/maven2|https://maven.google.com|https://oss.sonatype.org/content/repositories/public|https://packages.atlassian.com/mvn/maven-atlassian-external|https://repo.gradle.org/gradle/libs-releases|https://maven.pkg.github.com/appthreat/chen"

jobs:
  # Whether anything but documentation (docs/, Markdown) changed: a workflow that does not run
  # never reports its required check, so this one always runs and its tests skip instead.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          files=""
          case "$EVENT" in
            pull_request) files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') ;;
            # the compare API lists at most 300 files: more counts as code
            merge_group) files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" \
              --jq 'if (.files | length) < 300 then .files[].filename else "more" end') ;;
          esac
          code=true
          if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<<"$files"; then code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  lang-testing:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce; pr.yml's macOS leg covers macOS
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        java-version: ['25']
        node-version: ['26.x']
        ruby: ["4.0.5"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199  # v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'ShiftLeftSecurity/shiftleft-java-example'
          path: 'repotests/shiftleft-java-example'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'juice-shop/juice-shop'
          path: 'repotests/juice-shop'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'ShiftLeftSecurity/shiftleft-ts-example'
          path: 'repotests/shiftleft-ts-example'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'libexpat/libexpat'
          path: 'repotests/libexpat'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'HooliCorp/DjanGoat'
          path: 'repotests/DjanGoat'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'bionomia/bionomia'
          path: 'repotests/bionomia'
          ref: '5ada8b5f4a5f68561a7195e2badc2f744dc4676e'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'OWASP/railsgoat'
          path: 'repotests/railsgoat'
          ref: 'c1e8ff1e3b24a1c48fcfc9fbee0f65dc296b49d9'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'playframework/play-samples'
          path: 'repotests/play-samples'
          ref: '0dccba17856e89dbb5e457ab760efb14cc691395'
          persist-credentials: false
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465  # v9.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
      - uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4  # v3.1.0
        with:
          apps: scala3 scalac
      - name: "Install PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          coverage: "none"
          php-version: "8.3"
          tools: composer:v2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install sbt
        run: brew install sbt
        if: runner.os == 'macOS'
      - name: Install ubuntu packages
        run: |
          sudo apt update -y
          sudo apt install -y zlib1g php-zip
        if: runner.os == 'Linux'
      - uses: ./.github/actions/github-packages
      - name: atom node tests
        run: |
          sbt --server "stage; createDistribution"
          python -m pip install atom-tools
          cd wrapper/nodejs
          bash build.sh
          sudo npm install -g ./packages/atom-jar ./packages/atom @appthreat/atom-parsetools
          atom --help
          astgen --version
          rbastgen --help
          atom -l java -o ${GITHUB_WORKSPACE}/repotests/shiftleft-java-example/app.atom ${GITHUB_WORKSPACE}/repotests/shiftleft-java-example
          atom -l js -o ${GITHUB_WORKSPACE}/repotests/juice-shop/app.atom ${GITHUB_WORKSPACE}/repotests/juice-shop
          atom -l js -o ${GITHUB_WORKSPACE}/repotests/shiftleft-ts-example/app.atom ${GITHUB_WORKSPACE}/repotests/shiftleft-ts-example
          atom -l python -o ${GITHUB_WORKSPACE}/repotests/DjanGoat/app.atom ${GITHUB_WORKSPACE}/repotests/DjanGoat
          atom parsedeps -l python -o ${GITHUB_WORKSPACE}/repotests/DjanGoat/app.atom ${GITHUB_WORKSPACE}/repotests/DjanGoat
          atom -l c -o ${GITHUB_WORKSPACE}/repotests/libexpat/app.atom ${GITHUB_WORKSPACE}/repotests/libexpat
          atom -o ${GITHUB_WORKSPACE}/repotests/railsgoat/app.atom -l ruby ${GITHUB_WORKSPACE}/repotests/railsgoat
          atom -o ${GITHUB_WORKSPACE}/repotests/bionomia/app.atom -l ruby ${GITHUB_WORKSPACE}/repotests/bionomia
          atom -o ${GITHUB_WORKSPACE}/repotests/play-samples/play-scala-rest-api-example/app.atom -l scala ${GITHUB_WORKSPACE}/repotests/play-samples/play-scala-rest-api-example
          sudo npm uninstall -g @appthreat/atom @appthreat/atom-parsetools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: atom parse tools checks
        run: |
          cd wrapper/nodejs
          sudo npm install -g ./packages/atom-jar ./packages/atom @appthreat/atom-parsetools
          astgen --help
          rbastgen --help
          which scalasem
  nodejs-testing-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # pull requests try both jvms, the merge queue the required one
        java-version: ${{ fromJSON(github.event_name == 'merge_group' && '["25"]' || '["23", "25"]') }}
        node-version: ['26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'ShiftLeftSecurity/shiftleft-java-example'
          path: 'repotests/shiftleft-java-example'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'juice-shop/juice-shop'
          path: 'repotests/juice-shop'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'ShiftLeftSecurity/shiftleft-ts-example'
          path: 'repotests/shiftleft-ts-example'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'libexpat/libexpat'
          path: 'repotests/libexpat'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'HooliCorp/DjanGoat'
          path: 'repotests/DjanGoat'
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: 'playframework/play-samples'
          path: 'repotests/play-samples'
          ref: '0dccba17856e89dbb5e457ab760efb14cc691395'
          persist-credentials: false
      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465  # v9.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
      - uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4  # v3.1.0
        with:
          apps: scala3 scalac
      - uses: ./.github/actions/github-packages
      - name: build
        shell: pwsh
        run: |
          sbt --server "stage; createDistribution"
          python -m pip install atom-tools
          cd wrapper\\nodejs
          .\build.ps1
          npm install -g .\packages\atom-jar .\packages\atom @appthreat/atom-parsetools
          get-command atom
          get-command astgen
          get-command phpastgen
          astgen --version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: test
        shell: pwsh
        run: |
          atom -l java --remove-atom -o $env:GITHUB_WORKSPACE\\repotests\\shiftleft-java-example\\app.atom $env:GITHUB_WORKSPACE\\repotests\\shiftleft-java-example
          atom -l python --remove-atom -o $env:GITHUB_WORKSPACE\\repotests\\DjanGoat\\app.atom $env:GITHUB_WORKSPACE\\repotests\\DjanGoat
          atom parsedeps --remove-atom -l python -o $env:GITHUB_WORKSPACE\\repotests\\DjanGoat\\app.atom $env:GITHUB_WORKSPACE\\repotests\\DjanGoat
          atom -l c -o $env:GITHUB_WORKSPACE\\repotests\\libexpat\\app.atom $env:GITHUB_WORKSPACE\\repotests\\libexpat
          atom -l scala -o $env:GITHUB_WORKSPACE\\repotests\\play-samples\\play-scala-rest-api-example\\app.atom $env:GITHUB_WORKSPACE\\repotests\\play-samples\\play-scala-rest-api-example
      - name: test3
        shell: cmd
        run: |
          atom -l js --remove-atom -o %GITHUB_WORKSPACE%\\repotests\\shiftleft-ts-example\\app.atom %GITHUB_WORKSPACE%\\repotests\\shiftleft-ts-example

  # The required check for this workflow: one name that stays the same whatever the matrices
  # hold. It passes when every lang-testing and nodejs-testing-windows leg passed, or were skipped
  # because only documentation changed.
  langtests:
    needs: [changes, lang-testing, nodejs-testing-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every leg passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = success ] || { echo "changes: $CHANGES"; exit 1; }
          check() {
            case "$2" in
              success) ;;
              skipped) [ "$CODE" != true ] || { echo "$1 skipped although code changed"; exit 1; } ;;
              *) echo "$1: $2"; exit 1 ;;
            esac
          }
          check lang-testing "${{ needs.lang-testing.result }}"
          check nodejs-testing-windows "${{ needs.nodejs-testing-windows.result }}"
