name: Upload Container images

on:
  push:
    branches:
      - main
      - release/3.x
    tags:
      - 'v*'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Google's mirror of Maven Central first, repo1 and every resolver the build declares as
  # fallbacks (Maven Central is rate-limited from CI); drives the sbt launcher too. the
  # github-packages action writes the GitHub Packages credentials coursier needs for the last entry. Coursier requires
  # pipe-separated entries - a ';' separator or unknown alias makes it ignore the whole list.
  COURSIER_REPOSITORIES: "ivy2Local|https://maven-central.storage-download.googleapis.com/maven2|https://repo1.maven.org/maven2|https://maven.google.com|https://oss.sonatype.org/content/repositories/public|https://packages.atlassian.com/mvn/maven-atlassian-external|https://repo.gradle.org/gradle/libs-releases|https://maven.pkg.github.com/appthreat/chen"
  IMAGE_NAME: appthreat/atom

jobs:
  deploy:
    if: github.repository_owner == 'appthreat'
    strategy:
      fail-fast: true
      matrix:
        image:
          - id: amd64
            arch: amd64
          - id: arm64
            arch: arm64
            runner-suffix: -arm
          - id: amd64-sle
            arch: amd64
            image-suffix: -sle
          - id: arm64-sle
            arch: arm64
            image-suffix: -sle
            runner-suffix: -arm
          - id: amd64-ruby
            arch: amd64
            image-suffix: -ruby
          - id: arm64-ruby
            arch: arm64
            image-suffix: -ruby
            runner-suffix: -arm
          - id: amd64-ruby3
            arch: amd64
            image-suffix: -ruby3
          - id: arm64-ruby3
            arch: arm64
            image-suffix: -ruby3
            runner-suffix: -arm
          - id: amd64-alpine-ruby
            arch: amd64
            image-suffix: -alpine-ruby
          - id: arm64-alpine-ruby
            arch: arm64
            image-suffix: -alpine-ruby
            runner-suffix: -arm
          - id: amd64-alpine-ruby3
            arch: amd64
            image-suffix: -alpine-ruby3
          - id: arm64-alpine-ruby3
            arch: arm64
            image-suffix: -alpine-ruby3
            runner-suffix: -arm
    runs-on: ubuntu-24.04${{ matrix.image.runner-suffix }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78  # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e  # v1.5.14
      - uses: coursier/setup-action@d5a17f9aaeb260f9ba336a5b582fb49f79c64ac4  # v3.1.0
        with:
          apps: scala3 scalac
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26.x'
          package-manager-cache: false
      - name: Delete `.rustup` directory
        run: rm -rf /home/runner/.rustup # to save disk space
        if: runner.os == 'Linux'
      - name: Delete `.cargo` directory # to save disk space
        run: rm -rf /home/runner/.cargo
        if: runner.os == 'Linux'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashfiles('**/build.sbt') }}
          lookup-only: true
      - uses: ./.github/actions/github-packages
      - run: |
          sbt --server "stage; createDistribution"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/appthreat/atom${{ matrix.image.image-suffix }}
          flavor: latest=false,suffix=-${{ matrix.image.arch }}
      - name: Build and push Docker images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        id: build
        with:
          file: ci/Dockerfile${{ matrix.image.image-suffix }}
          context: .
          platforms: linux/${{ matrix.image.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
      - name: Write image metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p image-metadata
          jq -n \
            --arg key "${MATRIX_KEY}" \
            --arg image_uri "ghcr.io/appthreat/atom${IMAGE_SUFFIX}@${DIGEST}" \
            '{($key): {"image-uri": $image_uri}}' > "image-metadata/${MATRIX_KEY}.json"
        env:
          MATRIX_KEY: ${{ matrix.image.id }}
          IMAGE_SUFFIX: ${{ matrix.image.image-suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-metadata-${{ matrix.image.id }}
          path: image-metadata/${{ matrix.image.id }}.json
          if-no-files-found: error
          retention-days: 1

  deploy-manifest:
    if: github.repository_owner == 'appthreat'
    strategy:
      fail-fast: true
      matrix:
        image:
          - id: default
          - id: sle
            image-suffix: -sle
          - id: ruby
            image-suffix: -ruby
          - id: alpine-ruby
            image-suffix: -alpine-ruby
    runs-on: ubuntu-24.04
    needs: [deploy]
    outputs:
      image-uri: ghcr.io/appthreat/atom${{ matrix.image.image-suffix }}@${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        id: metadata
        with:
          images: ghcr.io/appthreat/atom${{ matrix.image.image-suffix }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: image-metadata-*
          path: image-metadata
          merge-multiple: true
      - name: Create and push multi-arch manifest
        id: build
        shell: bash
        run: |
          set -euo pipefail

          annotation_args=()
          while IFS= read -r label; do
            [ -n "${label}" ] || continue
            annotation_args+=(--annotation "index:${label}")
          done <<< "${LABELS}"

          amd64_key="amd64${IMAGE_SUFFIX}"
          arm64_key="arm64${IMAGE_SUFFIX}"
          sources=()
          for key in "${amd64_key}" "${arm64_key}"; do
            metadata_file="$(find image-metadata -name "${key}.json" -type f -print -quit)"
            if [ -z "${metadata_file}" ] || [ ! -s "${metadata_file}" ]; then
              echo "Unable to find image metadata artifact file: ${metadata_file}" >&2
              echo "Downloaded image metadata files:" >&2
              find image-metadata -maxdepth 2 -type f -print >&2 || true
              exit 1
            fi

            source="$(jq -r --arg key "${key}" '.[$key]."image-uri" // empty' "${metadata_file}")"
            if [ -z "${source}" ]; then
              echo "Unable to find source image for matrix output key: ${key}" >&2
              echo "Image metadata:" >&2
              jq . "${metadata_file}" >&2 || true
              exit 1
            fi
            sources+=("${source}")
          done

          if [ "${#sources[@]}" -lt 2 ]; then
            echo "Expected two source images for manifest, found ${#sources[@]}" >&2
            exit 1
          fi

          first_digest=""
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue

            echo "Creating multi-arch manifest: ${tag}"
            docker buildx imagetools create \
              "${annotation_args[@]}" \
              --tag "${tag}" \
              "${sources[@]}"

            inspect_status=0
            inspect_output="$(docker buildx imagetools inspect "${tag}" 2>&1)" || inspect_status=$?
            printf '%s\n' "${inspect_output}"

            tag_digest="$(awk '$1 == "Digest:" {print $2; exit}' <<< "${inspect_output}")"
            if [ -z "${tag_digest}" ]; then
              echo "Unable to determine manifest digest for ${tag}" >&2
              exit 1
            fi

            if [ "${inspect_status}" -ne 0 ]; then
              echo "::warning::docker buildx imagetools inspect exited with status ${inspect_status} for ${tag}, but reported digest ${tag_digest}; continuing"
            fi

            if [ -z "${first_digest}" ]; then
              first_digest="${tag_digest}"
            fi
          done <<< "${TAGS}"

          if [ -z "${first_digest}" ]; then
            echo "No tags found for manifest" >&2
            exit 1
          fi

          echo "digest=${first_digest}" >> "${GITHUB_OUTPUT}"
        env:
          LABELS: ${{ steps.metadata.outputs.labels }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          IMAGE_SUFFIX: ${{ matrix.image.image-suffix }}
