version = 3.8.2
runner.dialect = scala3
preset = IntelliJ
maxColumn = 100
align.preset = true

indent.main = 4
indent.significant = 2

newlines.source = keep
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
rewrite.scala3.insertEndMarkerMinLines = 20
rewrite.scala3.removeEndMarkerMaxLines = 18

rewrite.rules = [AvoidInfix]
rewrite.avoidInfix.excludeFilters."+" = [ "map" ]
rewrite.avoidInfix.excludePlaceholderArg = false

# sbt 2.x compiles build definitions with Scala 3
fileOverride {
  "glob:**/*.sbt" {
    runner.dialect = scala3
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala3
  }
}
